.kp-rail button{display:block;width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--line);padding:5px 0 5px 10px;color:var(--muted);cursor:pointer;font-size:12.5px;line-height:1.3}

.kp-btn-primary{background:var(--action);color:#fff}
.kp-btn-ghost{background:var(--card);color:var(--primary);border-color:var(--line)}

.kp-flash{box-shadow:0 0 0 3px var(--action)!important}
.kp-spin{display:inline-block;animation:kpspin 1s linear infinite}@keyframes kpspin{to{transform:rotate(360deg)}}

.kp-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--faint)}
img.kp-img{max-width:100%;border:1px solid var(--line);border-radius:8px;background:#fff}

/* ===== bridge (waterfall) ===== */
function bridge(n, mode) {
  const d = dk(n); const rows = [];
  if (mode === "run") {
    const s = SEP(d), o = OCT(d);
    rows.push({l:"Sep forecast, FY27",a:0,b:s.r27,t:"total"});
    if (n === "corp") { DESKS.forEach(x => { const dd = dk(x), delta = OCT(dd).r27 - SEP(dd).r27; rows.push({l:NODES[x].short,delta,t:"delta"}); }); const r = o.r27 - s.r27 - sum(rows.filter(x => x.t === "delta").map(x => x.delta)); if (Math.abs(r) >= 0.05) rows.push({l:"Rounding",delta:r,t:"delta"}); }
    else { const a = VQ(d,"Status Quo","2026-09"), b = VQ(d,"Status Quo","2026-10"); FYQ[2027].forEach((k,i) => rows.push({l:qlab(k),delta:b[i]-a[i],t:"delta"})); }
    rows.push({l:"Oct forecast, FY27",a:0,b:o.r27,t:"total"});
  } else {
    rows.push({l:"FY26 actual",a:0,b:FY(d,"Status Quo",2026),t:"total"});
    if (n === "corp") DESKS.forEach(x => rows.push({l:NODES[x].short,delta:FY(dk(x),"Status Quo",2027)-FY(dk(x),"Status Quo",2026),t:"delta"}));
    else FYQ[2027].forEach((k,i) => rows.push({l:qlab(k),delta:qv(d,"Status Quo",k)-qv(d,"Status Quo",FYQ[2026][i]),t:"delta"}));
    rows.push({l:"FY27 forecast",a:0,b:FY(d,"Status Quo",2027),t:"total"});
  }
  let run = rows[0].b; rows.forEach((r, i) => { if (r.t === "delta") { r.a = run; r.b = run + r.delta; run = r.b; } });
  return rows;
}

function dataChecks() {
  let maxDiff = 0; SCNS.forEach(s => P("Total",s).forEach((v,i) => { maxDiff = Math.max(maxDiff, Math.abs(v - P("Consulting",s)[i] - P("DAS",s)[i])); }));
  const rc = D.rest.Consulting, restPct = rc["2026-01"] / rc["2025-10"] - 1;
  const gTot = FG("Total","Status Quo",2027), gC = FG("Consulting","Status Quo",2027), gD = FG("DAS","Status Quo",2027);
  return [
   ["Total equals Consulting plus DA&S", maxDiff < 1 ? "pass" : "flag", `Largest quarterly difference across all scenarios is ${fmtM(maxDiff,2)}.`],
   ["Actuals are complete", "pass", `All three desks have actuals through ${qlab(D.lastActual)} (Jul–Sep 2026), the end of FY26.`],
   ["Duplicate rows", "flag", `${D.dq.dupDropped} duplicate rows were removed from the October 2025 refresh (a repeated Very Strong Growth row). Confirm the dropped rows were not a mislabelled Strong Growth scenario.`],
   ["Scenario coverage", "flag", `The October file has six scenarios. High Oil Price appears in the July to September files and is described in the deck, but is absent in October.`],
   ["Revenue restatement", "flag", `FY25 Consulting revenue was ${fmtM(rc["2025-10"])} in the October 2025 refresh and ${fmtM(rc["2026-01"])} from January 2026 (${fmtPct(restPct,1,true)}). Accuracy checks use January 2026 onward for this reason.`],
   ["FY27 Total growth matches the deck", Math.abs(gTot - 0.042) < 0.0015 ? "pass" : "flag", `File ${fmtPct(gTot,2,true)} against 4.2% on slide 2. DA&S ${fmtPct(gD,1,true)} matches the 9.8% on slide 2.`],
   ["FY27 Consulting growth matches the deck", "flag", `File ${fmtPct(gC,2,true)} matches slide 2 (1.1%), but slide 19 shows 3.9% and slide 22 shows 1.8% for the recalibrated model.`],
   ["FY27 Total revenue matches the deck", "flag", `File ${fmtM(FY("Total","Status Quo",2027))} against $5.48B on slide 6 (September: ${fmtM(SEP("Total").r27)} in the file, $5.55B on the slide).`],
   ["DA&S appendix figures", "flag", `Slide 20 gives 21.3% for FY26 and 11.1% for FY27; the file and slide 2 give 22.1% and 9.8%. Slide 20 may predate the October refresh.`],
   ["Strong Growth growth in the slide 6 table", "flag", `The October Strong Growth value on slide 6 is 1.0%, but the file gives ${fmtPct(FG("Total","Strong Growth",2027),1,true)}; likely a decimal slip on the slide.`],
   ["Validation table on slide 11", "flag", `The last DA&S row is labelled 10/1/27 but its values match Oct 2026, and the DA&S actuals for Apr 2025 (${fmtM(426.5)}) differ from the file (${fmtM(P("DAS","Status Quo")[D.quarters.indexOf("2025-04")])}). The page uses the file’s actuals.`],
   ["Corporate profit table sign", "flag", `Slide 4 shows the 2026 Q3 change as +137.59 where the October minus September difference is −137.59 and the percentage is −3.5%.`],
   ["September growth by scenario matches slide 6", "pass", `Status Quo ${fmtPct(SEP("Total").g27,1,true)}, Very Strong ${fmtPct(D.vint.Total["Very Strong Growth"]["2026-09"].g27,1,true)} and Severe Recession ${fmtPct(D.vint.Total["Severe Recession"]["2026-09"].g27,1,true)} reproduce the deck chart.`]];
}

  return `<div class="kp-grid-2"><div class="kp-card kp-pad" style="font-size:13.5px"><h3 style="font-size:14px;margin-top:0">Cadence</h3><p>The I-F forecast and Moody’s scenarios are refreshed monthly. This briefing reflects the October 2026 refresh (model file dated Oct 1, program update dated Oct 22). It is frozen to that evidence set; the feed never changes the official forecast.</p><p class="kp-faint">News and peer items on this page are entered by hand from public sources. There is no scheduler or live scan in this version.</p></div><div class="kp-card kp-pad" style="font-size:13.5px"><h3 style="font-size:14px;margin-top:0">Next refresh checklist</h3><ul style="padding-left:18px;margin:0"><li>Add the November scenario file and re-run the accuracy checks.</li><li>Confirm the Consulting model version and High Oil Price scenario.</li><li>Update Coming up and the peer table, including KPMG FY26 results.</li></ul></div></div>`;

/* ===== OVERLAYS: ask, evidence, signal ===== */
const SUGGEST = ["Draft an FY27 stakeholder update: performance versus Status Quo, desk highlights, risks and outlook.","Why did FY27 Status Quo growth fall in October?","Which scenario has tracked DA&S actuals best, and what does that imply?","How does our FY26 growth compare with the Big Four?","What is the downside to FY27 revenue in a Severe Recession, by desk?"];
function askContext() {
  const L = [];
  L.push("You are the assistant inside the ADV (KPMG Advisory) Intelligent Forecasting Insights dashboard. Answer only from the data below. If the data does not cover the question, say so and say what is missing. Be concise: short paragraphs, a few bullets when listing, numbers with units. Fiscal years run Oct–Sep (FY27 = Oct 2026 to Sep 2027). Cite sources as [E01] style tags using the evidence IDs after the figures they support. Do not invent figures, and do not describe peers beyond what the evidence says.");
  L.push("\nFISCAL-YEAR REVENUE, $M (FY25 and FY26 actual; FY27 and FY28 forecast), October 2026 refresh [E10]:");
  ["Total","Consulting","DAS"].forEach(d => SCNS.forEach(s => L.push(`${d === "DAS" ? "DA&S" : d} | ${s}: ` + [2025,2026,2027,2028].map(y => `FY${y-2000} ${Math.round(FY(d,s,y))} (${fmtPct(FG(d,s,y),1,true)})`).join("; "))));
  L.push("\nFY27 STATUS QUO BY REFRESH (growth, revenue $M):");
  ["Total","Consulting","DAS"].forEach(d => L.push(`${d === "DAS" ? "DA&S" : d}: ` + V(d).map(x => `${x.v} ${fmtPct(x.g27,1,true)} / ${Math.round(x.r27)}`).join(", ")));
  L.push("\nFORECAST ACCURACY (Status Quo, refreshes Jan–Sep 2026 against final actuals; 1 − weighted absolute % error):");
  ["Total","Consulting","DAS"].forEach(d => { const r = accRows(d,"Status Quo"); L.push(`${d === "DAS" ? "DA&S" : d}: ${((1-wape(r))*100).toFixed(1)}% accuracy, bias ${(bias(r)*100).toFixed(1)}% (positive = forecast above actual), ${r.length} points`); });
  L.push("Scenario error vs actuals: " + ["Total","Consulting","DAS"].map(d => `${d === "DAS" ? "DA&S" : d}: ` + SCNS.map(s => `${s} ${(wape(accRows(d,s))*100).toFixed(1)}%`).join(", ")).join(" | "));
  L.push("\nOCTOBER FORECAST PAGE: baseline model FY27 growth (deck): Total 3.1%, Consulting 1.1%, DA&S 6.5%; FY26 actual: Total 4.9%, Consulting −3.0%, DA&S 22.1% [E01]. Next quarter Q1 FY27 (Oct–Dec 2026) Status Quo: " + ["Total","Consulting","DAS"].map(d => `${d === "DAS" ? "DA&S" : d} ${Math.round(qv(d,"Status Quo","2026-10"))} (${fmtPct(qv(d,"Status Quo","2026-10")/qv(d,"Status Quo","2025-10")-1,1,true)} YoY)`).join(", ") + " [E10]. Scheduled hours next 3 months vs same months last year: Consulting −14.5%, DA&S +5.9% [E01]. Signals by horizon: internal signals feed the short term only; external signals feed short term, long term and scenarios; trend and seasonality feed short and long term.");
  L.push("\nINSIGHTS:"); INS.forEach(i => L.push(`${i.id} [${impactLabel(i)}; ${i.scope.join("/")}; ${HORIZON[i.horizon]}] ${i.title}. ${i.summary.replace(/\s+/g," ")} Sources: ${i.ev.join(",")}`));
  L.push("\nSIGNALS (sensitivity = model effect of a 10% YoY rise): " + SIGS.map(s => `${NODES[s.desk].short} ${s.name} ${s.sens}${s.read ? ", latest " + s.read : ""}`).join("; ") + " [E08]");
  L.push("\nMARKET: Moody’s Status Quo 2027 GDP +1.9% (2.0% in Sep), Fed +25 bps in Dec; 2027 GDP by scenario: " + MACRO.map(m => `${m[0]} ${m[1]}%`).join(", ") + " [E02]. After-tax corporate profits revised down 0.6% (2026Q1) to 6.6% (2027Q1), not a model input [E03].");
  L.push("INDUSTRY OPPORTUNITY SCORES: " + IND.map(r => `${r[0]} ${r[4]}`).join(", ") + " [E07].");
  L.push("PEERS (global revenue): " + PEERS.map(p => `${p.n} ${p.r26 ? "FY26 $" + p.r26 + "B" : "FY25 $" + p.r25 + "B"}, local growth +${p.lc}% [${p.ev}]: ${p.move}`).join(" | "));
  L.push("MODEL NOTES: Consulting refit: deck says 3.9% (current) vs 1.8% (recalibrated) FY27 Status Quo growth; the October file shows " + fmtPct(FG("Consulting","Status Quo",2027),1,true) + " [E09]. High Oil Price scenario is missing from the October file.");
  return L.join("\n");
}
function mdA(t) {
  const lines = esc(t).split("\n"); let out = "", ul = false; const f = x => x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[(E\d{2})\]/g,(m,id) => evChip(id) || m);
  for (const l of lines) { const m = l.match(/^\s*[-*•]\s+(.*)/); if (m) { if (!ul) { out += "<ul>"; ul = true; } out += `<li>${f(m[1])}</li>`; } else { if (ul) { out += "</ul>"; ul = false; } if (l.trim()) out += `<p>${f(l.replace(/^#+\s*/,""))}</p>`; } }
  return out + (ul ? "</ul>" : "");
}
function chatHTML() {
  if (!S.chat.length) return `<p class="kp-muted" style="font-size:14px;margin-top:0">Ask about the forecast, scenarios, accuracy, signals, markets or peers. Answers use only the data in this dashboard and cite their sources.</p>${S.ask && S.ask.focus ? `<div class="kp-note">Asking about: <b>${esc(S.ask.focus)}</b></div>` : ""}<div class="kp-faint sm" style="margin:12px 0 6px">Try asking</div>${SUGGEST.map((q,i) => `<button class="kp-btn kp-btn-ghost" style="display:block;width:100%;text-align:left;margin-bottom:8px;font-weight:400" data-act="suggest" data-id="${i}">${q}</button>`).join("")}`;
  return S.chat.map(m => m.role === "user" ? `<div class="kp-msg-user">${esc(m.content)}</div>` : `<div class="kp-answer${m.err ? " kp-error" : ""}">${m.err ? esc(m.content) : (m.pending && !m.content ? `<span class="kp-spin">↻</span> Thinking…` : mdA(m.content))}</div>`).join("");
}
function renderOverlay() {
  const el = document.getElementById("overlay"); let h = ""; const prev = document.getElementById("askq"), draft = prev ? prev.value : "";
  if (S.evId) { const e = EVBY[S.evId]; const used = INS.filter(i => i.ev.includes(e.id)); h += `<div class="kp-scrim" data-act="close-ev" style="z-index:78"></div><aside class="kp-drawer" style="z-index:80" role="dialog" aria-label="Source ${e.id}"><div class="kp-drawer-head"><b>Source ${e.id}</b><button class="kp-icon-btn" data-act="close-ev" aria-label="Close">✕</button></div><div class="kp-drawer-body"><div style="display:flex;gap:6px;flex-wrap:wrap">${chip(e.type,"blue")}${chip(e.tier,"neutral")}</div><h3 class="kp-h kp-h3" style="margin-top:10px">${esc(e.title)}</h3><p class="kp-faint sm" style="margin:2px 0 10px">${esc(e.publisher)} · ${e.date}</p><p style="font-size:14px">${esc(e.summary)}</p>${e.url ? `<p><a href="${e.url}" target="_blank" rel="noopener" style="color:var(--action);font-weight:600">Open the source</a></p>` : ""}${used.length ? `<h4 style="font-size:13.5px;color:var(--primary)">Used in</h4><ul style="padding-left:18px;font-size:13.5px">${used.map(i => `<li>${i.title}</li>`).join("")}</ul>` : ""}<button class="kp-btn kp-btn-ghost" data-act="ask-q" data-q="${esc("What does " + e.id + " say, and how does it affect the forecast?")}">Ask about this source</button></div></aside>`; }
  else if (S.sigId) { const s = SIGBY[S.sigId], used = INS.filter(i => (i.drivers || []).includes(s.id)); h += `<div class="kp-scrim" data-act="close-sig" style="z-index:78"></div><aside class="kp-drawer" style="z-index:80" role="dialog" aria-label="Signal"><div class="kp-drawer-head"><b>Signal</b><button class="kp-icon-btn" data-act="close-sig" aria-label="Close">✕</button></div><div class="kp-drawer-body"><div style="display:flex;gap:6px;flex-wrap:wrap">${chip(NODES[s.desk].name,"dark")}${chip(s.cat,"neutral")}${dirChip(s)}</div><h3 class="kp-h kp-h3" style="margin-top:10px">${s.name}</h3><p class="kp-faint sm" style="margin:2px 0 10px">Source: ${s.src}. Model input for ${NODES[s.desk].name}.</p>${tbl(["Item","Value"],[["Sensitivity (+10% YoY)",s.sens],["Latest reading",s.read || "Not in the program deck"]])}<p style="font-size:13.5px">${s.note}</p><p class="kp-faint sm">Sensitivity is the model effect of a 10% YoY rise in the signal, from the program deck. ${evChip("E08")}</p>${used.length ? `<h4 style="font-size:13.5px;color:var(--primary)">Insights that use it</h4><ul style="padding-left:18px;font-size:13.5px">${used.map(i => `<li>${i.title}</li>`).join("")}</ul>` : ""}</div></aside>`; }
  if (S.ask) h += `<div class="kp-scrim" data-act="close-ask"></div><aside class="kp-drawer" role="dialog" aria-label="Ask" style="z-index:75"><div class="kp-drawer-head"><b>Ask about ADV forecasts</b><div><button class="kp-btn kp-btn-ghost" data-act="new-chat" style="margin-right:6px">New chat</button><button class="kp-icon-btn" data-act="close-ask" aria-label="Close">✕</button></div></div><div class="kp-drawer-body" id="askbody">${chatHTML()}</div><div class="kp-ask-in"><textarea id="askq" rows="2" placeholder="Ask about sales, scenarios, accuracy, signals, peers…" aria-label="Your question"></textarea><button class="kp-btn kp-btn-primary" id="asksend" data-act="send">Send</button></div></aside>`;
  el.innerHTML = h;
  if (S.ask) { const q = document.getElementById("askq"); if (q) { if (draft) q.value = draft; if (!S.evId && !S.sigId) q.focus(); q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendAsk(q.value); } }); } }
}
function updateChat() { const b = document.getElementById("askbody"); if (b) { b.innerHTML = chatHTML(); b.scrollTop = b.scrollHeight; } const s = document.getElementById("asksend"); if (s) s.disabled = S.busy; }
async function sendAsk(text) {
  text = (text || "").trim(); if (!text || S.busy) return;
  const q = document.getElementById("askq"); if (q) q.value = "";
  S.chat.push({role:"user",content:text}); S.busy = true;
  const reply = {role:"assistant",content:"",pending:true}; S.chat.push(reply); updateChat();
  let sample = null; try { sample = await claude.use("sample"); } catch (e) { sample = null; }
  if (!sample) { reply.err = true; reply.pending = false; reply.content = "Ask is not available in this view. Open the dashboard from your claude.ai artifact link to use it."; S.busy = false; updateChat(); return; }
  const msgs = S.chat.filter(m => !m.err && m !== reply).map((m, i) => ({role: m.role, content: i === 0 ? askContext() + "\n\nQUESTION:\n" + m.content : m.content}));
  try { const r = await sample(msgs, {cache:false, modelTier:"default", onText: ({text: t}) => { reply.content = t; updateChat(); }}); reply.content = r.text || reply.content; reply.pending = false; }
  catch (e) { reply.pending = false; reply.err = true; reply.content = e && e.code === "not_granted" ? "Permission to ask Claude was declined. Send the question again and approve the prompt." : e && e.code === "rate_limited" ? "Too many questions in a short time. Wait a moment and try again." : "The answer could not be completed. Send the question again."; }
  S.busy = false; updateChat();
}

/* ===== APP SHELL ===== */
const VIEWS = {briefing:vBriefing, month:vMonth, explain:vExplain, anticipate:vAnticipate, position:vPosition, admin:vAdmin};
const TABS = [["briefing","Executive Briefing"],["month","October forecast"],["explain","Explain"],["anticipate","Anticipate"],["position","Position"]];
function renderTop() {
  const scope = S.scope, opt = id => `<option value="${id}"${scope === id ? " selected" : ""}>${id === "corp" ? "Total Advisory (company)" : NODES[id].name}</option>`;
  document.getElementById("top").innerHTML = `<header class="kp-hdr"><div class="kp-wrap"><svg viewBox="0 0 834.16 335.19" height="30" width="${30*834.16/335.19}" role="img" aria-label="KPMG"><path d="${KPMG_LOGO}" fill="#fff"/></svg>

   ${S.tab === "briefing" || S.tab === "admin" ? `<span class="kp-muted sm" style="margin-left:auto;padding:12px 0">${S.tab === "admin" ? "Admin applies to the whole forecast." : "Company view. Choose a desk on the other tabs."}</span>` : `<label style="margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding:6px 0">View <select class="kp-select" id="scope" aria-label="Scope">${opt("corp")}<optgroup label="Desks">${DESKS.map(opt).join("")}</optgroup></select></label>`}</div></nav>`;
  const h = document.querySelector(".kp-topbar").getBoundingClientRect().height; document.documentElement.style.setProperty("--topH", Math.round(h) + "px");

function render(keep) {
  const y = window.scrollY; Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; });
  if (S.tab !== "briefing" && S.tab !== "admin" && !NODES[S.scope]) S.scope = "corp";
  const v = VIEWS[S.tab](), m = document.getElementById("main");
  m.innerHTML = S.tab === "admin" ? v.html : `<div class="kp-shell"><div class="kp-railcol"><nav class="kp-rail" id="rail" aria-label="On this page"></nav></div><div class="kp-body">${v.html}</div></div>`;
  renderTop(); v.after(); buildRail(); renderOverlay();
  if (keep) window.scrollTo(0, y); else if (!S.jump) window.scrollTo(0, 0);

function flashTo(sel) { const el = document.querySelector(sel); if (!el) return; el.scrollIntoView({behavior:"smooth", block:"start"}); el.classList.add("kp-flash"); setTimeout(() => el.classList.remove("kp-flash"), 1800); }
function buildRail() {
  const r = document.getElementById("rail"); if (!r) return;
  const seen = new Set(), items = [...document.querySelectorAll("#main [data-section]")].map(e => ({e, t: e.getAttribute("data-section")})).filter(x => !seen.has(x.t) && seen.add(x.t));
  r.innerHTML = `<div class="kp-rail-h">On this page</div>${items.map((x, i) => `<button data-rail="${i}">${esc(x.t)}</button>`).join("")}`;
  const btns = [...r.querySelectorAll("button")];
  btns.forEach((b, i) => b.onclick = () => items[i].e.scrollIntoView({behavior:"smooth", block:"start"}));
  const upd = () => { const lim = (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--topH")) || 118) + 40; let cur = 0; items.forEach((x, i) => { if (x.e.getBoundingClientRect().top <= lim) cur = i; }); btns.forEach((b, i) => b.setAttribute("aria-current", i === cur ? "true" : "false")); };
  window.onscroll = upd; upd();
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return; const act = a.dataset.act, id = a.dataset.id;
  switch (act) {
    case "tab": S.tab = id; try { location.hash = id; } catch (_) {} render(false); break;

    case "kind": S.kind = id; render(true); break;

    case "ev": S.evId = id; S.sigId = null; renderOverlay(); break;
    case "sig": S.sigId = id; S.evId = null; renderOverlay(); break;
    case "close-ev": S.evId = null; renderOverlay(); break;
    case "close-sig": S.sigId = null; renderOverlay(); break;

    case "close-ask": S.ask = null; renderOverlay(); break;

    case "suggest": sendAsk(SUGGEST[+id]); break;
    case "ask-ins": { const i = INSBY[id]; S.ask = {focus: i.title}; S.evId = null; renderOverlay(); const q = document.getElementById("askq"); if (q) q.value = `Explain "${i.title}" and what we should do about it.`; break; }
    case "ask-q": { S.ask = {}; S.evId = null; renderOverlay(); const q = document.getElementById("askq"); if (q) q.value = a.dataset.q; break; }
    case "jump": flashTo(`article[data-id="${id}"]`); break;

});
